
name: Destinya Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          
      - name: Construire APK de test
        run: gradle -p android/android assembleDebug --info --stacktrace


      - name: Sauvegarder APK
        uses: actions/upload-artifact@v4
        with:
          name: Destinya-APK
          path: android/android/app/build/outputs/apk/debug/*.apk

      - name: Construire AAB
        run: gradle -p android/android bundleRelease

      - name: Sauvegarder AAB
        uses: actions/upload-artifact@v4
        with:
          name: Destinya-AAB
          path: android/android/app/build/outputs/bundle/release/*.aab
          
