
name: Destinya Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      - name: Construire le AAB
        run: gradle bundleRelease

      - name: Sauvegarder le AAB
        uses: actions/upload-artifact@v4
        with:
          name: Destinya-Demo-AAB
          path: app/build/outputs/bundle/release/*.aab
