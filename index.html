
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffe0e5">
<title>Destinya 💗</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:16px;
 display:grid;place-items:center;
 font-family:Arial,sans-serif;color:#593b49;
 background:linear-gradient(145deg,#fff0ed,#ffd6df,#ffe8d6)
}
main{
 width:100%;max-width:460px;padding:24px 20px;
 background:white;border-radius:26px;text-align:center;
 box-shadow:0 12px 35px #b76b7b30
}
h1{font-size:42px;color:#d65c82}
h2{color:#bd5275}
.heart{font-size:54px}
.hidden{display:none!important}
label{display:block;text-align:left;margin-top:12px}
input,select,textarea{
 width:100%;padding:13px;margin:7px 0;
 border:1px solid #f2c2d0;border-radius:13px;
 font:inherit;background:white
}
button{
 width:100%;padding:14px;margin:7px 0;
 border:0;border-radius:25px;
 font-size:16px;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.5}
.primary{background:#d65c82;color:white}
.secondary{background:#ffe1e8;color:#a94368}
.hidden{display:none!important}
small{display:block;margin:12px 0;line-height:1.5}
#message{color:#a94368;min-height:24px}
.card{
 padding:24px;border-radius:24px;margin:18px 0;
 background:linear-gradient(160deg,#fff0f4,#ffe5dc);
 touch-action:pan-y
}
.avatar{font-size:75px}
.name{font-size:26px;color:#bd5275;font-weight:bold}
.tag{
 display:inline-block;background:white;
 padding:8px 12px;border-radius:20px;
 margin:4px;font-size:13px
}
.actions{display:flex;gap:10px}
.actions button{flex:1}
.match{
 padding:16px;margin:10px 0;
 border-radius:16px;background:#fff0f4;
 text-align:left
}
</style>
</head>
<body>
<main>

<section id="home">
<div class="heart">💕</div>
<h1>Destinya</h1>
<p>Rencontres, amour et amitié.</p>
<button class="primary" onclick="showPage('register')">
Créer un compte
</button>
<button class="secondary" onclick="showPage('login')">
Se connecter
</button>
<button class="secondary" onclick="openDemo()">
🌸 Découvrir Destinya
</button>
<small>Réservé aux adultes de 18 ans et plus.</small>
</section>

<section id="register" class="hidden">
<h2>Créer mon compte 💗</h2>

<label>Pseudo</label>

<label>Date de naissance</label>
<input id="birthdate" type="date" required>
<label>Ville</label>
<input id="ville" maxlength="80" required>
<label>Je recherche</label>
<select id="objectif">
<option value="serieux">Relation sérieuse</option>
<option value="amitie">Amitié</option>
<option value="sans_engagement">Sans engagement</option>
</select>
<label>Adresse e-mail</label>
<input id="email" type="email" required>
<label>Mot de passe</label>

<button class="primary" type="submit">
Créer mon compte
</button>
</form>
<button class="secondary" onclick="showPage('home')">

<section id="login" class="hidden">

<form id="loginForm">
<input id="loginEmail" type="email"

<input id="loginPassword" type="password"

Se connecter

</button>

Retour

</section>

<section id="account" class="hidden">
<div class="heart">💗</div>
<h2>Bienvenue sur Destinya !</h2>
<p id="userEmail"></p>
<p id="verificationInfo"></p>
<button id="verifyEmail" class="secondary">
Envoyer un e-mail de vérification
</button>
<button id="refreshVerification" class="secondary">
Actualiser la vérification
</button>
<button id="editProfile" class="primary">
✏️ Compléter mon profil
</button>
<button id="publishProfile" class="primary">
🌸 Rendre mon profil visible
</button>
<button id="hideProfile" class="secondary">
🔒 Masquer mon profil
</button>
<small id="visibilityInfo">
Ton profil est privé par défaut.
</small>
<button id="discoverReal" class="primary">
💕 Découvrir les membres
</button>
<button id="viewMatches" class="primary">
❤️ Mes matchs

<button class="secondary" onclick="openDemo()">
Voir les profils fictifs

Se déconnecter
</button>

<section id="editProfilePage" class="hidden">
<h2>💗 Mon profil</h2>
<form id="editProfileForm">
<label>Pseudo</label>
<input id="editPseudo" maxlength="40" required>
<label>Date de naissance</label>
<input id="editBirthdate" type="date" required>
<label>Ville</label>
<input id="editVille" maxlength="80" required>
<label>Je recherche</label>
<select id="editObjectif">
<option value="serieux">Relation sérieuse</option>
<option value="amitie">Amitié</option>

</select>

<textarea id="editBio" maxlength="500" rows="4"
 placeholder="Parle un peu de toi..."></textarea>

💾 Enregistrer mon profil
</button>

<button class="secondary" onclick="showPage('account')">

<section id="profiles" class="hidden">

Retour à mon compte
</button>

<p id="message" role="status" aria-live="polite"></p>
</main>

<script>
let currentPage="home";
let returnPage="home";
let profileMode="demo";
let profileIndex=0;
let activeProfiles=[];
let lastProfileDoc=null;
let moreProfilesAvailable=false;
let loadingProfiles=false;
let actionBusy=false;

const PAGE_SIZE=20;
const likedDemoProfiles=new Set();

const demoProfiles=[
 {
  name:"Camille",age:26,ville:"Paris",
  avatar:"🌸",objectif:"amitie",
  bio:"J'aime les promenades et les livres.",
  interests:["Lecture","Nature"]
 },
 {
  name:"Alex",age:29,ville:"Lyon",
  avatar:"🎨",objectif:"serieux",
  bio:"Passionné de musique et de voyages.",
  interests:["Musique","Voyages"]
 },
 {
  name:"Léa",age:31,ville:"Lille",
  avatar:"🦋",objectif:"sans_engagement",
  bio:"J'adore cuisiner et le cinéma.",
  interests:["Cuisine","Cinéma"]
 }
];

const objectiveLabels={
 amitie:"Amitié",
 serieux:"Relation sérieuse",
 sans_engagement:"Sans engagement"
};

function showPage(page){
 document.querySelectorAll("main section").forEach(s=>{
  s.classList.add("hidden");
 });
 document.getElementById(page).classList.remove("hidden");
 document.getElementById("message").textContent="";
 currentPage=page;
}

function notice(text){
 document.getElementById("message").textContent=text;
}

function renderProfile(){
 const card=document.getElementById("swipeCard");
 const actions=document.getElementById("profileActions");
 const more=document.getElementById("loadMore");
 const count=document.getElementById("profileCount");

 more.classList.toggle(
  "hidden",
  profileMode!=="real"||!moreProfilesAvailable
 );

 if(!activeProfiles.length){
  count.textContent="Aucun profil disponible.";
  card.classList.add("hidden");
  actions.classList.add("hidden");
  document.getElementById("likesCount").textContent="";
  document.getElementById("demoNotice").textContent="";
  return;
 }

 card.classList.remove("hidden");
 actions.classList.remove("hidden");

 const p=activeProfiles[profileIndex];
 count.textContent=
  `Profil ${profileIndex+1} sur ${activeProfiles.length} chargés`;

 document.getElementById("profileType").textContent=
  profileMode==="demo"?"PROFIL FICTIF":"PROFIL PUBLIC";
 document.getElementById("profileAvatar").textContent=
  p.avatar||"💗";
 document.getElementById("profileName").textContent=
  `${p.name}, ${p.age} ans`;
 document.getElementById("profileBio").textContent=p.bio||"";

 const interests=document.getElementById("profileInterests");
 interests.replaceChildren();

 const tags=profileMode==="demo"
  ?p.interests
  :[p.ville,objectiveLabels[p.objectif]];

 tags.filter(Boolean).forEach(item=>{
  const span=document.createElement("span");
  span.className="tag";
  span.textContent=item;
  interests.appendChild(span);
 });

 document.getElementById("likesCount").textContent=
  profileMode==="demo"
  ?`❤️ Likes fictifs : ${likedDemoProfiles.size}`
  :"❤️ Les likes sont enregistrés dans Firebase.";

 document.getElementById("demoNotice").textContent=
  profileMode==="demo"
  ?"Démonstration avec des profils fictifs."
  :"Un match apparaît si vous vous aimez tous les deux.";
}

function openDemo(){
 returnPage=currentPage;
 profileMode="demo";
 profileIndex=0;
 activeProfiles=demoProfiles;
 showPage("profiles");
 renderProfile();
}

async function nextProfile(){
 if(!activeProfiles.length||actionBusy)return;

 if(profileMode==="demo"){
  profileIndex=(profileIndex+1)%activeProfiles.length;
  renderProfile();
  return;
 }

 if(profileIndex+1<activeProfiles.length){
  profileIndex++;
  renderProfile();
  return;
 }

 if(moreProfilesAvailable&&window.loadRealProfiles){
  const previous=activeProfiles.length;
  await window.loadRealProfiles();

  if(activeProfiles.length>previous){
   profileIndex=previous;
   renderProfile();
  }else{
   notice("Aucun autre profil disponible.");
  }
 }else{
  notice("Tu as parcouru tous les profils chargés.");
 }
}

async function likeProfile(){
 if(!activeProfiles.length||actionBusy)return;

 if(profileMode==="demo"){
  likedDemoProfiles.add(profileIndex);
  await nextProfile();
  return;
 }

 if(window.saveRealLike){
  await window.saveRealLike(activeProfiles[profileIndex]);
 }
}

function backFromProfiles(){
 showPage(returnPage);
}

let touchStartX=0;
const swipeCard=document.getElementById("swipeCard");

swipeCard.addEventListener("touchstart",e=>{
 touchStartX=e.changedTouches[0].screenX;
},{passive:true});

swipeCard.addEventListener("touchend",e=>{
 const diff=e.changedTouches[0].screenX-touchStartX;
 if(diff>70)likeProfile();
 else if(diff< -70)nextProfile();
},{passive:true});

window.showPage=showPage;
window.openDemo=openDemo;
window.nextProfile=nextProfile;
window.likeProfile=likeProfile;
window.backFromProfiles=backFromProfiles;
</script>
<script type="module">
import {initializeApp} from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
 getAuth,createUserWithEmailAndPassword,
 signInWithEmailAndPassword,signInWithPopup,
 GoogleAuthProvider,signOut,onAuthStateChanged,
 updateProfile,sendEmailVerification,reload
} from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
 getFirestore,doc,setDoc,getDoc,deleteDoc,
 collection,getDocs,serverTimestamp,
 query,limit,startAfter,where
} from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyA2yKCe2eo2WFC09ZNyrgPb-eWjOeQIChM",
 authDomain:"destinya-4279b.firebaseapp.com",
 projectId:"destinya-4279b",
 storageBucket:"destinya-4279b.firebasestorage.app",
 messagingSenderId:"562278259631",
 appId:"1:562278259631:web:8e907c2d0c7ab1ee072d5a",
 measurementId:"G-KJN8SNFXYE"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

function calculateAge(value){
 if(!value)return -1;
 const birth=new Date(value+"T12:00:00");
 const today=new Date();

 if(Number.isNaN(birth.getTime())||birth>today){
  return -1;
 }

 let age=today.getFullYear()-birth.getFullYear();

 if(
  today.getMonth()<birth.getMonth()||
  (
   today.getMonth()===birth.getMonth()&&
   today.getDate()<birth.getDate()
  )
 )age--;

 return age;
}

function errorText(error){
 const messages={
  "auth/email-already-in-use":"Adresse e-mail déjà utilisée.",
  "auth/invalid-email":"Adresse e-mail invalide.",
  "auth/weak-password":"Mot de passe trop faible.",
  "auth/invalid-credential":"Identifiants incorrects.",
  "auth/unauthorized-domain":"Domaine non autorisé.",
  "permission-denied":"Accès refusé. Vérifie les règles Firestore.",
  "failed-precondition":"Un index Firebase est nécessaire.",
  "AGE_INVALIDE":"Application réservée aux adultes."
 };
 return messages[error.code||error.message]||
  "Une erreur est survenue. Réessaie.";
}

async function createUserProfile(user,details){
 const age=calculateAge(details.birthdate);
 if(age<18||age>120)throw new Error("AGE_INVALIDE");

 await setDoc(doc(db,"Users",user.uid),{
  pseudo:details.pseudo,
  birthdate:details.birthdate,
  age,
  bio:"",
  ville:details.ville,
  objectif:details.objectif,
  photoURL:"",
  profilTest:false,
  createdAt:serverTimestamp()
 });
}

document.getElementById("registerForm")
.addEventListener("submit",async event=>{
 event.preventDefault();

 const details={
  pseudo:document.getElementById("name").value.trim(),
  birthdate:document.getElementById("birthdate").value,
  ville:document.getElementById("ville").value.trim(),
  objectif:document.getElementById("objectif").value
 };

 const age=calculateAge(details.birthdate);
 if(!details.pseudo||!details.ville||age<18||age>120){
  notice("Vérifie tes informations. Réservé aux 18 ans et plus.");
  return;
 }

 try{
  const result=await createUserWithEmailAndPassword(
   auth,
   document.getElementById("email").value.trim(),
   document.getElementById("password").value
  );

  await updateProfile(result.user,{displayName:details.pseudo});
  await createUserProfile(result.user,details);

  try{
   await sendEmailVerification(result.user);
   notice("Compte créé. Vérifie ton e-mail.");
  }catch{
   notice("Compte créé. Demande la vérification depuis ton compte.");
  }
 }catch(error){
  notice(errorText(error));
 }
});

document.getElementById("loginForm")
.addEventListener("submit",async event=>{
 event.preventDefault();
 try{
  await signInWithEmailAndPassword(
   auth,
   document.getElementById("loginEmail").value.trim(),
   document.getElementById("loginPassword").value
  );
 }catch(error){
  notice(errorText(error));
 }
});

document.getElementById("googleLogin")
.addEventListener("click",async()=>{
 try{
  const result=await signInWithPopup(
   auth,new GoogleAuthProvider()
  );
  const snap=await getDoc(doc(db,"Users",result.user.uid));
  if(!snap.exists()){
   notice("Connexion réussie. Complète ton profil.");
  }
 }catch(error){
  notice(errorText(error));
 }
});

document.getElementById("editProfile")
.addEventListener("click",async()=>{
 const user=auth.currentUser;
 if(!user)return;
 showPage("editProfilePage");

 try{
  const snap=await getDoc(doc(db,"Users",user.uid));
  const p=snap.exists()?snap.data():{};

  document.getElementById("editPseudo").value=
   p.pseudo||user.displayName||"";
  document.getElementById("editBirthdate").value=
   p.birthdate||"";
  document.getElementById("editVille").value=p.ville||"";
  document.getElementById("editObjectif").value=
   p.objectif||"serieux";
  document.getElementById("editBio").value=p.bio||"";
 }catch(error){
  notice(errorText(error));
 }
});

document.getElementById("editProfileForm")
.addEventListener("submit",async event=>{
 event.preventDefault();
 const user=auth.currentUser;
 if(!user)return;

 const pseudo=document.getElementById("editPseudo").value.trim();
 const birthdate=document.getElementById("editBirthdate").value;
 const ville=document.getElementById("editVille").value.trim();
 const objectif=document.getElementById("editObjectif").value;
 const bio=document.getElementById("editBio").value.trim();
 const age=calculateAge(birthdate);

 if(!pseudo||!ville||age<18||age>120){
  notice("Vérifie tes informations. Réservé aux 18 ans et plus.");
  return;
 }

 try{
  await setDoc(doc(db,"Users",user.uid),{
   pseudo,birthdate,age,ville,objectif,bio,
   profilTest:false,
   updatedAt:serverTimestamp()
  },{merge:true});

  await updateProfile(user,{displayName:pseudo});
  showPage("account");
  notice("Profil enregistré avec succès !");
 }catch(error){
  notice(errorText(error));
 }
});

async function refreshVisibility(){
 const user=auth.currentUser;
 if(!user)return;

 try{
  const snap=await getDoc(
   doc(db,"publicProfiles",user.uid)
  );
  document.getElementById("visibilityInfo").textContent=
   snap.exists()
   ?"Ton profil est visible par les membres."
   :"Ton profil est privé.";
 }catch(error){
  document.getElementById("visibilityInfo").textContent=
   errorText(error);
 }
}

document.getElementById("publishProfile")
.addEventListener("click",async()=>{
 const user=auth.currentUser;
 if(!user)return;

 try{
  await reload(user);
  if(!user.emailVerified){
   notice("Vérifie d'abord ton adresse e-mail.");
   return;
  }

  const snap=await getDoc(doc(db,"Users",user.uid));
  if(!snap.exists()){
   notice("Complète d'abord ton profil.");
   return;
  }

  const p=snap.data();
  if(
   !Number.isInteger(p.age)||p.age<18||
   !p.pseudo||!p.ville||
   !["amitie","serieux","sans_engagement"]
    .includes(p.objectif)
  ){
   notice("Vérifie ton profil avant publication.");
   return;
  }

  await setDoc(doc(db,"publicProfiles",user.uid),{
   pseudo:p.pseudo,
   age:p.age,
   ville:p.ville,
   objectif:p.objectif,
   bio:p.bio||"",
   visible:true,
   updatedAt:serverTimestamp()
  });

  notice("Ton profil est maintenant visible !");
  await refreshVisibility();
 }catch(error){
  notice(errorText(error));
 }
});

document.getElementById("hideProfile")
.addEventListener("click",async()=>{
 const user=auth.currentUser;
 if(!user)return;

 try{
  await deleteDoc(doc(db,"publicProfiles",user.uid));
  notice("Ton profil a été masqué.");
  await refreshVisibility();
 }catch(error){
  notice(errorText(error));
 }
});

/* Découverte : 20 profils par page */

async function loadRealProfiles(){
 if(loadingProfiles||!moreProfilesAvailable)return;

 const user=auth.currentUser;
 if(!user)return;

 loadingProfiles=true;
 const button=document.getElementById("loadMore");
 button.disabled=true;

 try{
  const ref=collection(db,"publicProfiles");
  const q=lastProfileDoc
   ?query(ref,startAfter(lastProfileDoc),limit(PAGE_SIZE))
   :query(ref,limit(PAGE_SIZE));

  const results=await getDocs(q);

  if(auth.currentUser?.uid!==user.uid)return;

  if(!results.empty){
   lastProfileDoc=results.docs[results.docs.length-1];
  }
  moreProfilesAvailable=results.size===PAGE_SIZE;

  const ids=new Set(activeProfiles.map(p=>p.id));

  for(const item of results.docs){
   const p=item.data();
   if(
    item.id===user.uid||ids.has(item.id)||
    p.visible!==true||p.age<18||!p.pseudo
   )continue;

   activeProfiles.push({
    id:item.id,
    name:p.pseudo,
    age:p.age,
    ville:p.ville,
    objectif:p.objectif,
    bio:p.bio||"",
    avatar:"💗"
   });
   ids.add(item.id);
  }

  renderProfile();
 }catch(error){
  notice(errorText(error));
 }finally{
  loadingProfiles=false;
  button.disabled=false;
 }
}

window.loadRealProfiles=loadRealProfiles;

document.getElementById("loadMore")
.addEventListener("click",async()=>{
 const previous=activeProfiles.length;
 await loadRealProfiles();
 if(activeProfiles.length>previous){
  profileIndex=previous;
  renderProfile();
 }
});

document.getElementById("discoverReal")
.addEventListener("click",async()=>{
 const user=auth.currentUser;
 if(!user)return;

 try{
  const snap=await getDoc(doc(db,"Users",user.uid));
  if(!snap.exists()){
   notice("Complète d'abord ton profil.");
   return;
  }

  profileMode="real";
  profileIndex=0;
  activeProfiles=[];
  lastProfileDoc=null;
  moreProfilesAvailable=true;
  returnPage="account";

  showPage("profiles");
  renderProfile();
  await loadRealProfiles();
 }catch(error){
  notice(errorText(error));
 }
});

/* Likes réels et matchs */

function likeId(from,to){
 return `${from}_${to}`;
}

function matchId(a,b){
 return [a,b].sort().join("_");
}

async function saveRealLike(profile){
 const user=auth.currentUser;
 if(!user||!profile||actionBusy)return;

 if(user.uid===profile.id){
  notice("Tu ne peux pas liker ton propre profil.");
  return;
 }

 actionBusy=true;

 try{
  const target=await getDoc(
   doc(db,"publicProfiles",profile.id)
  );

  if(!target.exists()){
   notice("Ce profil n'est plus disponible.");
   return;
  }

  await setDoc(
   doc(db,"likes",likeId(user.uid,profile.id)),
   {
    from:user.uid,
    to:profile.id,
    createdAt:serverTimestamp()
   }
  );

  const reciprocal=await getDoc(
   doc(db,"likes",likeId(profile.id,user.uid))
  );

  let matched=false;

  if(reciprocal.exists()){
   const members=[user.uid,profile.id].sort();

   await setDoc(
    doc(db,"matches",matchId(user.uid,profile.id)),
    {
     members,
     createdAt:serverTimestamp()
    }
   );

   matched=true;
  }

  actionBusy=false;
  await nextProfile();

  notice(
   matched
   ?"💕 C'est un match ! Vous vous aimez tous les deux !"
   :"❤️ Like enregistré !"
  );
 }catch(error){
  notice(errorText(error));
 }finally{
  actionBusy=false;
 }
}

window.saveRealLike=saveRealLike;

document.getElementById("viewMatches")
.addEventListener("click",async()=>{
 const user=auth.currentUser;
 if(!user)return;

 showPage("matches");

 const list=document.getElementById("matchesList");
 list.textContent="Chargement de tes matchs...";

 try{
  const q=query(
   collection(db,"matches"),
   where("members","array-contains",user.uid),
   limit(50)
  );

  const results=await getDocs(q);
  list.replaceChildren();

  if(results.empty){
   list.textContent="Tu n'as pas encore de match 💗";
   return;
  }

  for(const item of results.docs){
   const members=item.data().members||[];
   const otherId=members.find(id=>id!==user.uid);
   if(!otherId)continue;

   const profile=await getDoc(
    doc(db,"publicProfiles",otherId)
   );

   const div=document.createElement("div");
   div.className="match";

   const name=document.createElement("strong");
   name.textContent=profile.exists()
    ?profile.data().pseudo
    :"Membre indisponible";

   const info=document.createElement("p");
   info.textContent="💕 Vous avez un match !";

   div.append(name,info);
   list.appendChild(div);
  }
 }catch(error){
  list.textContent=errorText(error);
 }
});

document.getElementById("logout")
.addEventListener("click",async()=>{
 try{
  await signOut(auth);
 }catch(error){
  notice(errorText(error));
 }
});

document.getElementById("verifyEmail")
.addEventListener("click",async()=>{
 try{
  if(auth.currentUser){
   await sendEmailVerification(auth.currentUser);
   notice("E-mail de vérification envoyé.");
  }
 }catch(error){
  notice(errorText(error));
 }
});

document.getElementById("refreshVerification")
.addEventListener("click",async()=>{
 try{
  if(auth.currentUser){
   await reload(auth.currentUser);
   renderAccount(auth.currentUser);
  }
 }catch(error){
  notice(errorText(error));
 }
});

function renderAccount(user){
 if(!user){
  activeProfiles=[];
  lastProfileDoc=null;
  moreProfilesAvailable=false;
  showPage("home");
  return;
 }

 showPage("account");

 document.getElementById("userEmail").textContent=
  user.email||"";

 document.getElementById("verificationInfo").textContent=
  user.emailVerified
  ?"Adresse e-mail vérifiée."
  :"Adresse e-mail non vérifiée.";

 document.getElementById("verifyEmail")
  .classList.toggle("hidden",user.emailVerified);

 document.getElementById("refreshVerification")
  .classList.toggle("hidden",user.emailVerified);

 refreshVisibility();
}

onAuthStateChanged(auth,renderAccount);
</script>
</body>
</html>
