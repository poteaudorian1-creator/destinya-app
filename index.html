
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Destinya</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;
  display: grid;
  place-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(145deg,#fff0ed,#ffd6df,#ffe8d6);
  color: #593b49;
}

.container {
  width: 100%;
  max-width: 430px;
  padding: 30px 24px;
  background: white;
  border-radius: 28px;
  box-shadow: 0 12px 35px #b76b7b30;
  text-align: center;
}

h1 { color: #d65c82; font-size: 40px; }
h2 { color: #bd5275; }
.heart { font-size: 55px; }

input {
  width: 100%;
  padding: 15px;
  margin: 10px 0;
  border: 1px solid #f2c2d0;
  border-radius: 14px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  margin: 8px 0;
  border: 0;
  border-radius: 30px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.primary { background: #d65c82; color: white; }
.secondary { background: #ffe1e8; color: #a94368; }
.hidden { display: none !important; }
#message { color: #a94368; overflow-wrap: anywhere; }
small { display: block; margin: 12px 0; }
</style>
</head>

<body>
<main class="container">

<section id="home">
  <div class="heart">💕</div>
  <h1>Destinya</h1>
  <p>De belles rencontres et de nouvelles amitiés.</p>

  <button class="primary" onclick="showPage('register')">
    Créer un compte
  </button>

  <button class="secondary" onclick="showPage('login')">
    Se connecter
  </button>

  <small>Prototype réservé aux adultes.</small>
</section>

<section id="register" class="hidden">
  <h2>Créer mon compte</h2>

  <form id="registerForm">
    <input id="name" placeholder="Prénom" maxlength="40" required>

    <label for="birthdate">Date de naissance</label>
    <input id="birthdate" type="date" required>

    <input id="email" type="email"
      placeholder="Adresse e-mail" required>

    <input id="password" type="password"
      placeholder="Mot de passe (8 caractères minimum)"
      minlength="8" required>

    <button class="primary" type="submit">
      Créer mon compte
    </button>
  </form>

  <button class="secondary" onclick="showPage('home')">
    Retour
  </button>
</section>

<section id="login" class="hidden">
  <h2>Connexion</h2>

  <form id="loginForm">
    <input id="loginEmail" type="email"
      placeholder="Adresse e-mail" required>

    <input id="loginPassword" type="password"
      placeholder="Mot de passe" required>

    <button class="primary" type="submit">
      Se connecter
    </button>
  </form>

  <button class="secondary" onclick="showPage('home')">
    Retour
  </button>
</section>

<section id="account" class="hidden">
  <div class="heart">💗</div>
  <h2>Bienvenue sur Destinya !</h2>
  <p id="userEmail"></p>
  <p id="verificationInfo"></p>

  <button id="verifyEmail" class="primary">
    Envoyer un e-mail de vérification
  </button>

  <button id="refreshVerification" class="secondary">
    Actualiser la vérification
  </button>

  <button id="logout" class="secondary">
    Se déconnecter
  </button>
</section>

<p id="message" role="status" aria-live="polite"></p>
</main>

<script>
function showPage(page) {
  document.querySelectorAll("main section").forEach(section => {
    section.classList.add("hidden");
  });

  document.getElementById(page).classList.remove("hidden");
  document.getElementById("message").textContent = "";
}
</script>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged,
  updateProfile,
  sendEmailVerification,
  reload
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2yKCe2eo2WFC09ZNyrgPb-eWjOeQIChM",
  authDomain: "destinya-4279b.firebaseapp.com",
  projectId: "destinya-4279b",
  storageBucket: "destinya-4279b.firebasestorage.app",
  messagingSenderId: "562278259631",
  appId: "1:562278259631:web:8e907c2d0c7ab1ee072d5a",
  measurementId: "G-KJN8SNFXYE"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const message = document.getElementById("message");

function notice(text) {
  message.textContent = text;
}

function isAdult(value) {
  if (!value) return false;
  const date = new Date(value + "T12:00:00");
  const today = new Date();

  if (Number.isNaN(date.getTime()) || date > today) {
    return false;
  }

  let age = today.getFullYear() - date.getFullYear();

  if (
    today.getMonth() < date.getMonth() ||
    (today.getMonth() === date.getMonth() &&
     today.getDate() < date.getDate())
  ) {
    age--;
  }

  return age >= 18;
}

function errorText(error) {
  const messages = {
    "auth/email-already-in-use": "Adresse e-mail déjà utilisée.",
    "auth/invalid-email": "Adresse e-mail invalide.",
    "auth/weak-password": "Mot de passe trop faible.",
    "auth/invalid-credential": "E-mail ou mot de passe incorrect.",
    "auth/too-many-requests": "Trop de tentatives.",
    "auth/operation-not-allowed": "Active la connexion e-mail dans Firebase.",
    "auth/unauthorized-domain": "Domaine non autorisé dans Firebase."
  };

  return messages[error.code] || "Erreur : réessaie plus tard.";
}

document.getElementById("registerForm")
  .addEventListener("submit", async event => {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const birthdate = document.getElementById("birthdate").value;
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!name || !isAdult(birthdate)) {
      notice("Inscription réservée aux 18 ans et plus.");
      return;
    }

    try {
      const result = await createUserWithEmailAndPassword(
        auth, email, password
      );

      await updateProfile(result.user, { displayName: name });
      await sendEmailVerification(result.user);

      notice("Compte créé ! Vérifie ton e-mail.");
    } catch (error) {
      notice(errorText(error));
    }
  });

document.getElementById("loginForm")
  .addEventListener("submit", async event => {
    event.preventDefault();

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (error) {
      notice(errorText(error));
    }
  });

document.getElementById("logout")
  .addEventListener("click", async () => {
    try {
      await signOut(auth);
    } catch (error) {
      notice(errorText(error));
    }
  });

document.getElementById("verifyEmail")
  .addEventListener("click", async () => {
    try {
      if (auth.currentUser) {
        await sendEmailVerification(auth.currentUser);
        notice("E-mail de vérification envoyé.");
      }
    } catch (error) {
      notice(errorText(error));
    }
  });

document.getElementById("refreshVerification")
  .addEventListener("click", async () => {
    try {
      if (auth.currentUser) {
        await reload(auth.currentUser);
        renderAccount(auth.currentUser);
        notice("Vérification actualisée.");
      }
    } catch (error) {
      notice(errorText(error));
    }
  });

function renderAccount(user) {
  if (!user) {
    showPage("home");
    return;
  }

  showPage("account");

  document.getElementById("userEmail").textContent =
    user.email || "";

  document.getElementById("verificationInfo").textContent =
    user.emailVerified
      ? "Adresse e-mail vérifiée."
      : "Adresse e-mail non vérifiée.";

  document.getElementById("verifyEmail")
    .classList.toggle("hidden", user.emailVerified);

  document.getElementById("refreshVerification")
    .classList.toggle("hidden", user.emailVerified);
}

onAuthStateChanged(auth, renderAccount);
</script>

</body>
</html>
